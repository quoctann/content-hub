name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN is automatically provided, no secret to create
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/content-backend:${{ steps.tag.outputs.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/content-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger manifest update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'content-gitops',
              workflow_id: 'update-image-tag.yml',
              ref: 'main',
              inputs: {
                image_tag: '${{ steps.tag.outputs.IMAGE_TAG }}'
              }
            });
            console.log('Manifest update triggered for tag: ${{ steps.tag.outputs.IMAGE_TAG }}');
