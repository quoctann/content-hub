server:
  app_env: "local"
  port: "8080"

logger:
  level: "debug"

database:
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: "postgres"
  name: "postgres"
  ssl_mode: "disable"
  auto_migrate: true
  migrations_path: "migrations"

security:
  api_key: "123"
  allow_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:5173"
    - "http://127.0.0.1:3000"
