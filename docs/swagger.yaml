definitions:
  domain.Article:
    properties:
      content:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  domain.Content:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_deleted:
        type: boolean
      tags:
        items:
          $ref: '#/definitions/domain.Tag'
        type: array
      text:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/domain.ContentType'
      updated_at:
        type: string
      url:
        type: string
    type: object
  domain.ContentType:
    enum:
    - text
    - image
    type: string
    x-enum-varnames:
    - Text
    - Image
  domain.Tag:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_deleted:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      password:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
paths:
  /articles:
    get:
      consumes:
      - application/json
      description: Fetch articles with pagination
      parameters:
      - description: Number of articles
        in: query
        name: num
        type: integer
      - description: Cursor for pagination
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Article'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fetch articles
      tags:
      - articles
    post:
      consumes:
      - application/json
      description: Store a new article
      parameters:
      - description: Article
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/domain.Article'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Article'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Store article
      tags:
      - articles
  /articles/{id}:
    get:
      consumes:
      - application/json
      description: Get article by ID
      parameters:
      - description: Article ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Article'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get article by ID
      tags:
      - articles
  /contents:
    get:
      consumes:
      - application/json
      description: Search contents by query text
      parameters:
      - description: Search query
        in: query
        name: q
        type: string
      - description: Number of results
        in: query
        name: num
        type: integer
      - description: Cursor for pagination
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Content'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search contents
      tags:
      - contents
    post:
      consumes:
      - application/json
      description: Store a new content
      parameters:
      - description: Content
        in: body
        name: content
        required: true
        schema:
          $ref: '#/definitions/domain.Content'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Content'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Store content
      tags:
      - contents
  /contents/{id}:
    put:
      consumes:
      - application/json
      description: Update existing content
      parameters:
      - description: Content ID
        in: path
        name: id
        required: true
        type: integer
      - description: Content
        in: body
        name: content
        required: true
        schema:
          $ref: '#/definitions/domain.Content'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Content'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update content
      tags:
      - contents
  /health/live:
    get:
      description: Returns 200 if the application is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
  /users:
    get:
      consumes:
      - application/json
      description: Fetch all users with status 'active'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Fetch active users
      tags:
      - users
  /users/{id}:
    get:
      consumes:
      - application/json
      description: Get user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user by ID
      tags:
      - users
swagger: "2.0"
