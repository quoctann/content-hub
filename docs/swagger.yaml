basePath: /
definitions:
  domain.Content:
    properties:
      caption:
        description: available for image content
        type: string
      created_at:
        type: string
      id:
        type: integer
      link:
        type: string
      ocr_text:
        description: available for image content after OCR processing
        type: string
      rank:
        description: Relevance rank from FTS, 0 if no search query
        type: number
      text_data:
        description: available for text content
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/domain.ContentType'
      updated_at:
        type: string
    type: object
  domain.ContentType:
    enum:
    - text
    - image
    type: string
    x-enum-varnames:
    - Text
    - Image
  http.ContentResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      link:
        type: string
      rank:
        type: number
      text_data:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/domain.ContentType'
    type: object
host: localhost:8080
info:
  contact: {}
  description: Content Hub API Server.
  title: Content Hub API
  version: "1.0"
paths:
  /contents:
    get:
      consumes:
      - application/json
      description: Search contents by keywords, query text, type, and tags
      parameters:
      - description: 'Comma-separated keywords: hello,world'
        in: query
        name: keywords
        type: string
      - description: 'Match type: and (all must match) or or (any match), default
          or'
        in: query
        name: match_type
        type: string
      - description: Search query (deprecated, use keywords)
        in: query
        name: q
        type: string
      - description: Content type filter (image, text)
        in: query
        name: type
        type: string
      - description: Number of results
        in: query
        name: num
        type: integer
      - description: Cursor for pagination
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.ContentResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Search contents
      tags:
      - contents
    post:
      consumes:
      - application/json
      description: Store a new content
      parameters:
      - description: Content
        in: body
        name: content
        required: true
        schema:
          $ref: '#/definitions/domain.Content'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.ContentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Store content
      tags:
      - contents
  /contents/{id}:
    put:
      consumes:
      - application/json
      description: Update existing content
      parameters:
      - description: Content ID
        in: path
        name: id
        required: true
        type: integer
      - description: Content
        in: body
        name: content
        required: true
        schema:
          $ref: '#/definitions/domain.Content'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ContentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update content
      tags:
      - contents
  /health/live:
    get:
      description: Returns 200 if the application is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
