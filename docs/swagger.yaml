basePath: /
definitions:
  domain.ContentType:
    enum:
    - text
    - image
    type: string
    x-enum-varnames:
    - Text
    - Image
  http.AdminContentResponseWrapper:
    properties:
      items:
        items:
          $ref: '#/definitions/http.ContentResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.AdminPaginationResponse'
    type: object
  http.AdminPaginationResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  http.ContentResponse:
    properties:
      caption:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_hidden:
        type: boolean
      link:
        type: string
      ocr_text:
        type: string
      rank:
        type: number
      text_data:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/domain.ContentType'
      updated_at:
        type: string
    type: object
  http.ContentSearchResponseWrapper:
    properties:
      items:
        items:
          $ref: '#/definitions/http.ContentResponse'
        type: array
      pagination:
        $ref: '#/definitions/http.PaginationMetaResponse'
    type: object
  http.CreateContentRequest:
    properties:
      caption:
        type: string
      link:
        type: string
      ocr_text:
        type: string
      text_data:
        type: string
      title:
        type: string
      type:
        enum:
        - text
        - image
        type: string
    required:
    - type
    type: object
  http.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  http.LoginResponse:
    properties:
      csrf_token:
        type: string
      expires_in:
        type: integer
    type: object
  http.PaginationMetaResponse:
    properties:
      cursor:
        type: string
      has_more:
        type: boolean
      next_cursor:
        type: string
      page_size:
        type: integer
      total_count:
        type: integer
    type: object
  http.RefreshResponse:
    properties:
      csrf_token:
        type: string
      expires_in:
        type: integer
    type: object
  http.ToggleHideRequest:
    properties:
      hidden:
        type: boolean
    required:
    - hidden
    type: object
  http.UpdateContentRequest:
    properties:
      caption:
        type: string
      is_hidden:
        type: boolean
      link:
        type: string
      ocr_text:
        type: string
      text_data:
        type: string
      title:
        type: string
      type:
        enum:
        - text
        - image
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Content Hub API Server.
  title: Content Hub API
  version: "1.0"
paths:
  /account/login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password, returns access/refresh
        tokens in cookies
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - account
  /account/logout:
    post:
      consumes:
      - application/json
      description: Clear access/refresh tokens cookies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - account
  /account/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token from cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RefreshResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh token
      tags:
      - account
  /admin/contents:
    get:
      consumes:
      - application/json
      description: List all content including hidden ones, with optional search/filter
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      - description: 'Comma-separated keywords: hello,world'
        in: query
        name: keywords
        type: string
      - description: Content type filter (image, text)
        in: query
        name: type
        type: string
      - description: 'Visibility filter: true (visible only), false (hidden only),
          or empty (all)'
        in: query
        name: visible
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AdminContentResponseWrapper'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List all content for admin
      tags:
      - admin-contents
  /admin/contents/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently delete a content entry
      parameters:
      - description: Content ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete content
      tags:
      - admin-contents
    get:
      consumes:
      - application/json
      description: Get a single content entry by its ID
      parameters:
      - description: Content ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ContentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get content by ID
      tags:
      - admin-contents
  /admin/contents/{id}/hide:
    patch:
      consumes:
      - application/json
      description: Set content as hidden or visible
      parameters:
      - description: Content ID
        in: path
        name: id
        required: true
        type: integer
      - description: Hidden state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ToggleHideRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ContentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Toggle content visibility
      tags:
      - admin-contents
  /contents:
    get:
      consumes:
      - application/json
      description: Search contents by keywords and type
      parameters:
      - description: 'Comma-separated keywords: hello,world'
        in: query
        name: keywords
        type: string
      - description: 'Match type: and (all must match) or or (any match), default
          or'
        in: query
        name: match_type
        type: string
      - description: Content type filter (image, text)
        in: query
        name: type
        type: string
      - description: Number of results
        in: query
        name: num
        type: integer
      - description: Cursor for pagination
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ContentSearchResponseWrapper'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Search contents
      tags:
      - contents
    post:
      consumes:
      - application/json
      description: Store a new content
      parameters:
      - description: Content
        in: body
        name: content
        required: true
        schema:
          $ref: '#/definitions/http.CreateContentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.ContentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Store content
      tags:
      - contents
  /contents/{id}:
    put:
      consumes:
      - application/json
      description: Update existing content (supports partial updates)
      parameters:
      - description: Content ID
        in: path
        name: id
        required: true
        type: integer
      - description: Content (partial fields allowed)
        in: body
        name: content
        required: true
        schema:
          $ref: '#/definitions/http.UpdateContentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ContentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update content
      tags:
      - contents
  /health/live:
    get:
      description: Returns 200 if the application is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
swagger: "2.0"
