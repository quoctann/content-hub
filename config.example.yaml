server:
  app_env: "local"
  port: "8080"

logger:
  level: "debug"

database:
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: "postgres"
  name: "postgres"
  ssl_mode: "disable"
  schema: "myschema"
  auto_migrate: true
  migrations_path: "migrations"

security:
  api_key: "123"
  allow_origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000"
  jwt_secret: "example-secret-key-change-in-production"
  jwt_expiry: "24h"
  csp_default_src: ""
  csp_script_src: ""
  csp_style_src: "https://fonts.googleapis.com"
  csp_img_src: ""
  csp_font_src: "https://fonts.gstatic.com,https://cdn.jsdelivr.net/npm"
  csp_connect_src: ""
  csp_frame_src: ""
  csp_media_src: ""
  csp_object_src: ""
